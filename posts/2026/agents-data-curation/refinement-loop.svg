<svg xmlns="http://www.w3.org/2000/svg" width="900" height="238" viewBox="0 0 900 238" role="img" aria-labelledby="title desc">
  <title id="title">A possible next refinement round</title>
  <desc id="desc">Review fresh predictions and random documents with an agent or LLM and a person. Use corrected examples to refine the guide and retrain. Evaluate on fresh held-out data, then repeat if the task needs better labels. This is a proposed next step.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#987138"/></marker></defs>
  <style>text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;} .main {font-size:25px;font-weight:600;fill:#213344;} .sub {font-size:19px;fill:#526171;} .arrow {fill:none;stroke:#987138;stroke-width:2;marker-end:url(#arrow);}</style>
  <rect width="900" height="238" fill="white"/>
  <text x="16" y="26" font-size="17" font-weight="600" letter-spacing="1" fill="#7e5b27">POSSIBLE NEXT ITERATION</text>
  <rect x="16" y="47" width="264" height="116" rx="8" fill="#f8f3e9" stroke="#daceb8"/>
  <text x="36" y="80" class="main">Review a sample</text>
  <text x="36" y="111" class="sub">Predictions + random docs</text>
  <text x="36" y="141" class="sub">Agent / LLM + you</text>
  <path d="M281 105 H305" class="arrow"/>
  <rect x="317" y="47" width="264" height="116" rx="8" fill="#f8f3e9" stroke="#daceb8"/>
  <text x="337" y="80" class="main">Refine and retrain</text>
  <text x="337" y="111" class="sub">Use corrected examples</text>
  <text x="337" y="141" class="sub">Version the classifier</text>
  <path d="M582 105 H607" class="arrow"/>
  <rect x="619" y="47" width="264" height="116" rx="8" fill="#edf4f6" stroke="#c0d5dd"/>
  <text x="639" y="80" class="main">Evaluate again</text>
  <text x="639" y="111" class="sub">Fresh held-out documents</text>
  <text x="639" y="141" class="sub">Check per-label results</text>
  <path d="M751 165 V192 Q751 202 741 202 H158 Q148 202 148 192 V170" class="arrow"/>
  <rect x="263" y="187" width="374" height="30" fill="white"/>
  <text x="450" y="208" text-anchor="middle" class="sub">Repeat if the task needs better labels</text>
</svg>
